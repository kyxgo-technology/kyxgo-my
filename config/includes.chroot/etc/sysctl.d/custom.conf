### SYSCTL CONFIG ##############################################################

### NETWORKING

# Disable packet forwarding (we are not a router)
net.ipv4.ip_forward = 0
# Disable sending redirects (we are not a router)
net.ipv4.conf.all.send_redirects = 0

# Disable IPv6
net.ipv6.conf.all.disable_ipv6 = 1
# Disable IPv6 traffic forwarding.
net.ipv6.conf.all.forwarding = 0

# Limit configuration information disclosed by IPv6
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.all.router_solicitations = 0
net.ipv6.conf.all.accept_ra_rtr_pref = 0
net.ipv6.conf.all.accept_ra_pinfo = 0
net.ipv6.conf.all.accept_ra_defrtr = 0
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.all.dad_transmits = 0
net.ipv6.conf.all.max_addresses = 1

# Disable IP source routing
net.ipv4.conf.all.accept_source_route = 0

# Enable IP spoofing protection (2 - Loose mode for dynamic networks/tethering)
net.ipv4.conf.all.rp_filter = 2

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0

# Allow ICMP ECHO requests (ping allowed for diagnostics)
net.ipv4.icmp_echo_ignore_all = 0

# Ignore all ICMP ECHO and TIMESTAMP requests received via broadcast/multicast
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Limit the amount of traffic the system uses for ICMP.
net.ipv4.icmp_ratelimit = 100

# Adjust the ICMP ratelimit
net.ipv4.icmp_ratemask = 88089

# Ignore bogus error responses from ICMP
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log Spoofed Packets
net.ipv4.conf.all.log_martians = 0

# Decrease tcp timeouts
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 1800

# Turn off TCP SACK & timestamps for DoS protection
net.ipv4.tcp_sack = 0
net.ipv4.tcp_timestamps = 0

# Don't relay BOOTP
net.ipv4.conf.all.bootp_relay = 0

# Enable TCP SYN Cookies (SYN flood Protection)
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# Increase tcp-time-wait buckets pool size
net.ipv4.tcp_max_tw_buckets = 1440000

# ARP configuration
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1

# Don't proxy ARP for anyone
net.ipv4.conf.all.proxy_arp = 0


### MEMORY/SWAP

# Do not swap unless necessary (Great for low-RAM machines)
vm.swappiness = 10

# Balanced caching for file managers
vm.vfs_cache_pressure = 100


### MISC SECURITY

# Disable the magic-sysrq key
kernel.sysrq = 0

# Controls whether core dumps will append the PID
kernel.core_uses_pid = 1

# Prevent core dumps from SUID processes
fs.suid_dumpable = 0

# Restrict exposing kernel addresses
kernel.kptr_restrict = 1

# Restrict PTRACE debugging scope
kernel.yama.ptrace_scope = 1
