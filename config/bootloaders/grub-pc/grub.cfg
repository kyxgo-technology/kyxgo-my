Set default=0

loadfont $prefix/dejavu-bold-16.pf2
loadfont $prefix/dejavu-bold-14.pf2
loadfont $prefix/unicode.pf2
set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png
insmod jpeg

set color_normal=light-gray/black
set color_highlight=white/black

# Check for splash.jpg first (for GRUB boot menu) or splash.png
if [ -e /boot/grub/splash.jpg ]; then
    set theme=/boot/grub/live-theme/theme.txt
elif [ -e /isolinux/splash.png ]; then
    set theme=/boot/grub/live-theme/theme.txt
elif [ -e /boot/grub/splash.png ]; then
    set theme=/boot/grub/live-theme/theme.txt
else
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
fi

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1

# Main Live Boot Entry
menuentry "Kyxgo OS Live (English)" {
    linux KERNEL_LIVE APPEND_LIVE locales=en_US.UTF-8 keyboard-layouts=us
    initrd INITRD_LIVE
}

# Graphical Installer
KYXGO_INSTALL

# Advanced Boot Options
submenu 'Advanced options...' {
    KYXGO_ADVANCED_INSTALL
    MEMTEST
}
