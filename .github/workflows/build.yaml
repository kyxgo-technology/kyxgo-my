name: Build Kyxgo OS Production Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Previous Builds & Installs
        run: |
          sudo rm -rf build
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux syslinux-utils xorriso squashfs-tools debian-archive-keyring

      - name: Configure Live-Build Environment
        run: |
          mkdir -p build && cd build
          lb config \
            --mode debian \
            --architectures amd64 \
            --distribution trixie \
            --linux-flavours amd64 \
            --linux-packages "linux-image-amd64" \
            --initramfs live-boot \
            --system live \
            --security false \
            --apt-indices false \
            --bootappend-live "boot=live components hostname=kyxgo username=kyxgo splash quiet fastboot timezone=UTC" \
            --parent-mirror-bootstrap "http://deb.debian.org/debian" \
            --parent-mirror-chroot "http://deb.debian.org/debian" \
            --parent-mirror-binary "http://deb.debian.org/debian" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloader grub-live \
            --debian-installer false

      - name: Inject Pure Debian Package List
        run: |
          cd build
          rm -rf config/package-lists/*
          mkdir -p config/package-lists
          echo "live-boot live-config xfce4 xfce4-goodies lightdm network-manager network-manager-gnome curl wget git sudo python3" > config/package-lists/kyxgo.list.chroot

      - name: Inject Chrome, Deep Clean & Fast Boot Optimization Hook
        run: |
          cd build
          mkdir -p config/hooks/live

          # 1. Google Chrome Installation Hook
          cat << 'EOF' > config/hooks/live/01-install-chrome.hook.chroot
          #!/bin/sh
          mkdir -p /etc/apt/keyrings
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y google-chrome-stable
          EOF
          chmod +x config/hooks/live/01-install-chrome.hook.chroot

          # 2. Complete Debian Branding Purge, Hostname & Speedup Hook
          cat << 'EOF' > config/hooks/live/02-kyxgo-production.hook.chroot
          #!/bin/sh
          # Set Hostname System Wide
          echo "kyxgo" > /etc/hostname
          echo "127.0.0.1 kyxgo localhost" > /etc/hosts

          # Completely Purge Debian Default Branding Packages
          apt-get purge -y desktop-base debian-reference-common debian-faq avahi-daemon cups || true
          apt-get autoremove --purge -y

          # Wipe out all default Debian wallpapers/logos
          rm -rf /usr/share/images/desktop-base/*
          rm -rf /usr/share/backgrounds/*
          rm -rf /usr/share/wallpapers/*
          rm -rf /usr/share/pixmaps/debian*

          # Create Kyxgo Asset Directories
          mkdir -p /usr/share/backgrounds/kyxgo/
          mkdir -p /usr/share/images/desktop-base/
          mkdir -p /usr/share/backgrounds/xfce/
          mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/

          # Disable unneeded services
          systemctl mask ufw.service bluetooth.service cups.service || true
          EOF
          chmod +x config/hooks/live/02-kyxgo-production.hook.chroot

      - name: Copy Kyxgo Assets (Splash & Wallpaper Support)
        run: |
          cd build
          mkdir -p config/includes.chroot/usr/share/backgrounds/kyxgo/
          
          if [ -f ../splash.png ]; then
            cp ../splash.png config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          elif [ -f ../splash.jpg ]; then
            cp ../splash.jpg config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          elif [ -f ../assets/splash.png ]; then
            cp ../assets/splash.png config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          elif [ -f ../assets/splash.jpg ]; then
            cp ../assets/splash.jpg config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          elif [ -f ../wallpaper.png ]; then
            cp ../wallpaper.png config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          fi

      - name: Post-Copy Force Symlinks Hook (Branding Lock)
        run: |
          cd build
          cat << 'EOF' > config/hooks/live/03-force-symlinks.hook.chroot
          #!/bin/sh
          if [ -f /usr/share/backgrounds/kyxgo/wallpaper.png ]; then
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/default.png
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/desktop-background
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/login-background.svg
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/backgrounds/xfce/xfce-stripes.png
          fi
          EOF
          chmod +x config/hooks/live/03-force-symlinks.hook.chroot

      - name: Build Kyxgo ISO Image
        run: |
          cd build
          sudo lb build

      - name: Organize Output Artifact
        run: |
          mkdir -p dist
          mv build/*.iso dist/kyxgo-os-live-amd64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyxgo-OS-Live-ISO
          path: dist/kyxgo-os-live-amd64.iso
          retention-days: 7
