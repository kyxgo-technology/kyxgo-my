name: Build Kyxgo OS ISO

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          apt-get update
          apt-get install -y live-build debootstrap cpio xorriso isolinux syslinux-utils ca-certificates debian-archive-keyring debconf-utils memtest86+ git

      - name: Configure Live-Build inside Pure Debian Container
        run: |
          lb clean --purge || true
          rm -rf .build/ cache/ config/bootstrap config/chroot config/common config/binary

          lb config \
            --apt-recommends false \
            --apt-indices false \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-filesystem ext4 \
            --binary-images iso-hybrid \
            --checksums sha256 \
            --clean \
            --debconf-frontend noninteractive \
            --distribution bookworm \
            --security true \
            --firmware-binary true \
            --firmware-chroot true \
            --initramfs live-boot \
            --initsystem systemd \
            --iso-publisher "kyxgo-live-config" \
            --iso-volume "kyxgo-live-config-5.0.0" \
            --keyring-packages "debian-archive-keyring" \
            --linux-packages "linux-image-amd64" \
            --bootappend-live "boot=live config splash" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://deb.debian.org/debian-security" \
            --mirror-binary-security "http://deb.debian.org/debian-security"

      - name: Clean Package Lists & Neutralize Conflicting Entries
        run: |
          if [ -d "config/package-lists" ]; then
            sed -i 's/#.*//g' config/package-lists/* || true
            sed -i 's/ubuntu-keyring//g' config/package-lists/* || true
            sed -i 's/keepassxc-full/keepassxc/g' config/package-lists/* || true
            sed -i 's/network-manager-applet/network-manager-gnome/g' config/package-lists/* || true
            sed -i 's/gnome-software-plugin-deb//g' config/package-lists/* || true
            sed -i 's/gnome-software-plugin-fwupd//g' config/package-lists/* || true
            sed -i 's/libblockdev-crypto3//g' config/package-lists/* || true
            sed -i 's/pinta//g' config/package-lists/* || true
            sed -i 's/libguestfs-rescue//g' config/package-lists/* || true
            sed -i 's/libguestfs-tools//g' config/package-lists/* || true
            sed -i 's/firmware-ipw2x00//g' config/package-lists/* || true
            sed -i 's/firmware-ivtv//g' config/package-lists/* || true
            sed -i 's/b43-fwcutter//g' config/package-lists/* || true
          fi

          mkdir -p config/package-lists
          echo "linux-image-amd64 live-boot live-config live-config-systemd debian-archive-keyring" > config/package-lists/kernel.list.chroot

      - name: Build ISO Image
        run: |
          lb build

      - name: Rename ISO to Kyxgo Branding
        run: |
          ISO_FILE=$(ls *.iso *.hybrid.iso 2>/devnull | head -n 1)
          if [ -f "$ISO_FILE" ]; then
            mv "$ISO_FILE" kyxgo-os-live-amd64.iso
            echo "ISO renamed successfully to kyxgo-os-live-amd64.iso"
          else
            echo "Error: ISO build failed or file not found!" && exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyxgo-OS-ISO
          path: kyxgo-os-live-amd64.iso
          retention-days: 7
