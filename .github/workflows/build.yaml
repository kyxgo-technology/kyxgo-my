name: Build Kyxgo OS ISO

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Live-Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap cpio xorriso isolinux syslinux-utils ca-certificates debian-archive-keyring debconf-utils memtest86+

      - name: Hard Purge Stale Caches & Archives
        run: |
          # Clean live-build cache & conflicting archive sources
          sudo lb clean --purge || true
          sudo rm -rf .build/ cache/ config/bootstrap config/chroot config/common config/binary
          sudo rm -rf config/archives/* config/chroot_apt/*

      - name: Master Pre-seed (Auto-Accept All Prompts)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "firmware-ipw2x00 firmware-ipw2x00/license/accepted boolean true" | sudo debconf-set-selections || true
          echo "firmware-ivtv firmware-ivtv/license/accepted boolean true" | sudo debconf-set-selections || true
          echo "b43-fwcutter b43-fwcutter/install-fetch boolean false" | sudo debconf-set-selections || true
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections || true
          echo "macchanger macchanger/automatically_run boolean false" | sudo debconf-set-selections || true
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula boolean true" | sudo debconf-set-selections || true

      - name: Force Configure Live-Build (Debian Pure Repositories)
        run: |
          sudo lb config \
            --apt-recommends false \
            --apt-indices false \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-filesystem ext4 \
            --binary-images iso-hybrid \
            --checksums sha256 \
            --clean \
            --debconf-frontend noninteractive \
            --distribution bookworm \
            --security true \
            --firmware-binary true \
            --firmware-chroot true \
            --initramfs live-boot \
            --initsystem systemd \
            --iso-publisher "kyxgo-live-config" \
            --iso-volume "kyxgo-live-config-5.0.0" \
            --keyring-packages "debian-archive-keyring" \
            --linux-packages "linux-image-amd64" \
            --bootappend-live "boot=live config splash" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security" \
            --mirror-binary-security "http://deb.debian.org/debian-security"

      - name: Pre-Build Deep Sanitize Engine
        run: |
          # 1. Neutralize any hardcoded Ubuntu mirrors/keyrings in configs
          sudo find config/ -type f -exec sed -i 's/security.ubuntu.com\/ubuntu/deb.debian.org\/debian-security/g' {} + || true
          sudo find config/ -type f -exec sed -i 's/archive.ubuntu.com\/ubuntu/deb.debian.org\/debian/g' {} + || true
          sudo find config/ -type f -exec sed -i 's/ubuntu-keyring//g' {} + || true

          # 2. Neutralize conflicting init-systems and bootloader theme entries
          sudo find config/ -type f -exec sed -i 's/live-config-upstart//g' {} + || true
          sudo find config/ -type f -exec sed -i 's/live-config-sysvinit//g' {} + || true
          sudo find config/ -type f -exec sed -i 's/syslinux-themes-.*//g' {} + || true
          sudo find config/ -type f -exec sed -i 's/gfxboot-theme-.*//g' {} + || true

          # 3. Clean custom package lists inside repo
          if [ -d "config/package-lists" ]; then
            sudo sed -i 's/#.*//g' config/package-lists/* || true
            sudo sed -i 's/ubuntu-keyring//g' config/package-lists/* || true
            sudo sed -i 's/keepassxc-full/keepassxc/g' config/package-lists/* || true
            sudo sed -i 's/network-manager-applet/network-manager-gnome/g' config/package-lists/* || true
            sudo sed -i 's/gnome-software-plugin-deb//g' config/package-lists/* || true
            sudo sed -i 's/gnome-software-plugin-fwupd//g' config/package-lists/* || true
            sudo sed -i 's/libblockdev-crypto3//g' config/package-lists/* || true
            sudo sed -i 's/pinta//g' config/package-lists/* || true
            sudo sed -i 's/libguestfs-rescue//g' config/package-lists/* || true
            sudo sed -i 's/libguestfs-tools//g' config/package-lists/* || true
            sudo sed -i 's/firmware-ipw2x00//g' config/package-lists/* || true
            sudo sed -i 's/firmware-ivtv//g' config/package-lists/* || true
            sudo sed -i 's/b43-fwcutter//g' config/package-lists/* || true
          fi

          mkdir -p config/package-lists
          echo "linux-image-amd64 live-boot live-config live-config-systemd debian-archive-keyring" > config/package-lists/kernel.list.chroot

      - name: Build ISO Image
        run: |
          sudo lb build

      - name: Rename ISO to Kyxgo Branding
        run: |
          ISO_FILE=$(ls *.iso *.hybrid.iso 2>/devnull | head -n 1)
          if [ -f "$ISO_FILE" ]; then
            mv "$ISO_FILE" kyxgo-os-live-amd64.iso
            echo "ISO renamed successfully to kyxgo-os-live-amd64.iso"
          else
            echo "Error: ISO build failed or file not found!" && exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyxgo-OS-ISO
          path: kyxgo-os-live-amd64.iso
          retention-days: 7
