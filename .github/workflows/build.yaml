name: Build Kyxgo OS Clean Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux syslinux-utils xorriso squashfs-tools

      - name: Configure Live-Build Environment
        run: |
          mkdir -p build && cd build
          lb config \
            --architectures amd64 \
            --distribution trixie \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloader grub-live \
            --debian-installer false

      - name: Inject Custom Kyxgo Packages
        run: |
          cd build
          mkdir -p config/package-lists
          echo "xfce4 xfce4-goodies lightdm network-manager network-manager-gnome curl wget git sudo python3 google-chrome-stable" > config/package-lists/kyxgo.list.chroot

      - name: Inject Chrome & Deep Clean Hooks (Debian Purge)
        run: |
          cd build
          mkdir -p config/hooks/live

          # 1. Google Chrome Installation Hook
          cat << 'EOF' > config/hooks/live/01-install-chrome.hook.chroot
          #!/bin/sh
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y google-chrome-stable
          EOF
          chmod +x config/hooks/live/01-install-chrome.hook.chroot

          # 2. Complete Debian Branding Purge Hook
          cat << 'EOF' > config/hooks/live/02-kyxgo-branding-purge.hook.chroot
          #!/bin/sh
          # Debian base packages ko system se bilkul uda do
          apt-get purge -y desktop-base debian-reference-common debian-faq || true
          apt-get autoremove --purge -y

          # Default wallpaper directories ko poora saaf/blank kar do
          rm -rf /usr/share/images/desktop-base/*
          rm -rf /usr/share/backgrounds/*
          rm -rf /usr/share/wallpapers/*
          rm -rf /usr/share/pixmaps/debian*

          # Kyxgo asset folders banao
          mkdir -p /usr/share/backgrounds/kyxgo/
          mkdir -p /usr/share/images/desktop-base/
          mkdir -p /usr/share/backgrounds/xfce/

          # User Profile Config Setup
          mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
          EOF
          chmod +x config/hooks/live/02-kyxgo-branding-purge.hook.chroot

      - name: Copy Kyxgo Wallpaper Assets
        run: |
          cd build
          mkdir -p config/includes.chroot/usr/share/backgrounds/kyxgo/
          
          # Checks for wallpaper file in repo root or assets folder
          if [ -f ../assets/kyxgo-wallpaper.png ]; then
            cp ../assets/kyxgo-wallpaper.png config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          elif [ -f ../wallpaper.png ]; then
            cp ../wallpaper.png config/includes.chroot/usr/share/backgrounds/kyxgo/wallpaper.png
          fi

      - name: Post-Copy Force Symlinks Hook
        run: |
          cd build
          cat << 'EOF' > config/hooks/live/03-force-symlinks.hook.chroot
          #!/bin/sh
          # System jahan se bhi wallpaper dhundega, wahin Kyxgo ka wallpaper redirect ho jayega
          if [ -f /usr/share/backgrounds/kyxgo/wallpaper.png ]; then
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/default.png
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/desktop-background
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/images/desktop-base/login-background.svg
              ln -sf /usr/share/backgrounds/kyxgo/wallpaper.png /usr/share/backgrounds/xfce/xfce-stripes.png
          fi
          EOF
          chmod +x config/hooks/live/03-force-symlinks.hook.chroot

      - name: Build Kyxgo ISO Image
        run: |
          cd build
          sudo lb build

      - name: Organize Output Artifact
        run: |
          mkdir -p dist
          mv build/*.iso dist/kyxgo-os-live-amd64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyxgo-OS-Live-ISO
          path: dist/kyxgo-os-live-amd64.iso
          retention-days: 7
