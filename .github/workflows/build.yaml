name: Build Kyxgo OS ISO

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install All Complete Dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap cpio xorriso isolinux syslinux-utils ca-certificates debian-archive-keyring debconf-utils memtest86+ git squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools

      - name: Configure Live-Build inside Debian Trixie Container
        run: |
          lb clean --purge || true
          rm -rf .build/ cache/ config/bootstrap config/chroot config/common config/binary

          lb config \
            --apt-recommends false \
            --apt-indices false \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-filesystem ext4 \
            --binary-images iso-hybrid \
            --checksums sha256 \
            --clean \
            --debconf-frontend noninteractive \
            --distribution trixie \
            --security true \
            --firmware-binary true \
            --firmware-chroot true \
            --initramfs live-boot \
            --initsystem systemd \
            --iso-publisher "kyxgo-live-config" \
            --iso-volume "kyxgo-live-config-5.0.0" \
            --keyring-packages "debian-archive-keyring" \
            --linux-packages "linux-image" \
            --bootappend-live "boot=live config splash" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://deb.debian.org/debian-security" \
            --mirror-binary-security "http://deb.debian.org/debian-security"

      - name: Clean Package Lists & Neutralize Failing Hooks
        run: |
          if [ -d "config/package-lists" ]; then
            sed -i 's/#.*//g' config/package-lists/* || true
            sed -i 's/ubuntu-keyring//g' config/package-lists/* || true
            sed -i 's/keepassxc-full/keepassxc/g' config/package-lists/* || true
            sed -i 's/network-manager-applet/network-manager-gnome/g' config/package-lists/* || true
            sed -i 's/gnome-software-plugin-deb//g' config/package-lists/* || true
            sed -i 's/gnome-software-plugin-fwupd//g' config/package-lists/* || true
            sed -i 's/libblockdev-crypto3//g' config/package-lists/* || true
            sed -i 's/pinta//g' config/package-lists/* || true
            sed -i 's/libguestfs-rescue//g' config/package-lists/* || true
            sed -i 's/libguestfs-tools//g' config/package-lists/* || true
            sed -i 's/firmware-ipw2x00//g' config/package-lists/* || true
            sed -i 's/firmware-ivtv//g' config/package-lists/* || true
            sed -i 's/b43-fwcutter//g' config/package-lists/* || true
            sed -i 's/linux-image-amd64//g' config/package-lists/* || true
          fi

          # Neutralize failing rm scripts in binary hooks
          if [ -d "config/hooks" ]; then
            find config/hooks -type f -name "*.binary" -exec sed -i 's/rm /rm -f /g' {} + || true
            find config/hooks -type f -name "*.binary" -exec bash -c 'echo " || true" >> "$1"' _ {} \; || true
          fi

      - name: Build ISO Image
        run: |
          lb build

      - name: Rename ISO to Kyxgo Branding
        run: |
          ISO_FILE=$(ls *.iso *.hybrid.iso 2>/devnull | head -n 1)
          if [ -f "$ISO_FILE" ]; then
            mv "$ISO_FILE" kyxgo-os-live-amd64.iso
            echo "ISO renamed successfully to kyxgo-os-live-amd64.iso"
          else
            echo "Error: ISO build failed or file not found!" && exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyxgo-OS-ISO
          path: kyxgo-os-live-amd64.iso
          retention-days: 7

      - name: Create Release and Upload Direct ISO
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.0-live"
          name: "Kyxgo OS Official Live Build"
          body: "Direct downloadable ISO build for Kyxgo OS."
          files: kyxgo-os-live-amd64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
